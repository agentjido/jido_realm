name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v5
    secrets: inherit
    with:
      credo_command: mix credo --strict
      changelog_guard_mode: no_unreleased
      # Git pins provide the Shell and VFS APIs required by Realm.
      validate_hex_package: false
      docs_command: mix docs -f html
      test_command: >-
        mix test &&
        MIX_ENV=test mix test.realm &&
        MIX_ENV=test mix test.integration
